name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  test-and-build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            runtime/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run test:gui
      - run: npm run dist
      - run: npm run test:gui -- --packaged
      - run: npm run test:runtime -- dist/win-unpacked/resources/runtime
      - uses: actions/upload-artifact@v4
        with:
          name: DSH-Desktop-Windows-x64
          path: dist/*.exe
          if-no-files-found: error
