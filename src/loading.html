<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Starting DSH Desktop</title>
    <style>
      :root { color-scheme: dark; font-family: "Segoe UI", sans-serif; background: #0f172a; color: #e2e8f0; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; }
      main { max-width: 520px; padding: 40px; text-align: center; }
      .logo { width: 68px; height: 68px; display: grid; place-items: center; margin: 0 auto 22px; border-radius: 18px; background: #2563eb; font-size: 28px; font-weight: 700; }
      .spinner { width: 26px; height: 26px; margin: 28px auto 0; border: 3px solid #475569; border-top-color: #60a5fa; border-radius: 50%; animation: spin .8s linear infinite; }
      #detail { color: #94a3b8; line-height: 1.6; }
      .failed .spinner { display: none; }
      .failed #detail { color: #fca5a5; }
      @keyframes spin { to { transform: rotate(360deg); } }
    </style>
  </head>
  <body>
    <main>
      <div class="logo">DSH</div>
      <h1>Starting DeepSeek Harness</h1>
      <p id="detail">Launching the local service securely on 127.0.0.1…</p>
      <div class="spinner"></div>
    </main>
    <script>
      window.dshDesktop.onStatus(({ state, details }) => {
        document.body.classList.toggle('failed', state === 'failed' || state === 'stopped');
        document.querySelector('h1').textContent = state === 'stopped' ? 'DeepSeek Harness stopped' : 'Unable to start DeepSeek Harness';
        document.querySelector('#detail').textContent = details;
      });
    </script>
  </body>
</html>
